name: Omar Gate

# Modeled on mrrCarter/sentinelayer-web's Omar Gate, simplified for this repo:
# managed-LLM mode (default) so only SENTINELAYER_TOKEN is required — no BYOK
# OpenAI/Google keys. The action runs the scan, posts the PR check, and gates
# merges at the configured severity.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Sentinelayer scan profile
        required: false
        default: deep
        type: choice
        options:
          - deep
          - baseline
          - audit

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

jobs:
  omar-review:
    name: Omar Gate (Deep Scan)
    # Skip the privileged scan on forked PRs (no access to repo secrets).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Omar secret
        shell: bash
        env:
          SENTINELAYER_TOKEN: ${{ secrets.SENTINELAYER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SENTINELAYER_TOKEN:-}" ]; then
            echo "::error::SENTINELAYER_TOKEN is required. Set it with: gh secret set SENTINELAYER_TOKEN --repo mrrCarter/matchroom"
            exit 1
          fi

      - name: Omar Gate
        id: omar
        uses: mrrCarter/sentinelayer-v1-action@03d7369cba7de2e9f15b959275c982111f0ee493 # v1.3.8
        with:
          github_token: ${{ github.token }}
          sentinelayer_token: ${{ secrets.SENTINELAYER_TOKEN }}
          sentinelayer_managed_llm: "true"
          scan_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_mode || 'deep' }}
          severity_gate: P1

      - name: Omar run summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Omar Gate"
            echo "- gate_status: \`${{ steps.omar.outputs.gate_status }}\`"
            echo "- findings: \`P0=${{ steps.omar.outputs.p0_count }} P1=${{ steps.omar.outputs.p1_count }} P2=${{ steps.omar.outputs.p2_count }} P3=${{ steps.omar.outputs.p3_count }}\`"
            echo "- merge gate: \`severity_gate=P1\` (blocks on P0/P1)"
          } >> "$GITHUB_STEP_SUMMARY"
